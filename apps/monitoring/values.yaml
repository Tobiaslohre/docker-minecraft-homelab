alertmanager:
  enabled: false

kubeEtcd:
  enabled: false
kubeControllerManager:
  enabled: false
kubeScheduler:
  enabled: false
kubeProxy:
  enabled: false

prometheus-node-exporter:
  hostNetwork: false
  listenOnAllInterfaces: true

prometheus:
  prometheusSpec:
    retention: 7d
    retentionSize: 6GB
    storageSpec:
      volumeClaimTemplate:
        spec:
          storageClassName: local-path
          accessModes:
            - ReadWriteOnce
          resources:
            requests:
              storage: 10Gi

grafana:
  admin:
    existingSecret: monitoring-grafana-admin
    userKey: admin-user
    passwordKey: admin-password
  deploymentStrategy:
    type: Recreate
  persistence:
    enabled: true
    storageClassName: local-path
    size: 1Gi
